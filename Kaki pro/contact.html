<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&family=Ubuntu&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/7c38e880ad.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <style>
        #title{
            background-color: #ff4c68;
            color: #fff;
            text-align: center;
        }

        .container-fluid{
            padding: 3% 15% 7%;
        }

        body{
            font-family: 'Montserrat', sans-serif;
        }

        .navbar-brand{
            font-family: 'Ubuntu', sans-serif;
            font-size: 2rem;
            font-weight: bold;
        }

        .navbar{
            padding: 0 0 4.5rem;
        }

        .nav-item{
            padding: 0 18px;
        }

        .nav-link{
            font-size: 1.2rem;
        }

        /* Modal Content/Box */
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto 15% auto; /* 5% from the top, 15% from the bottom and centered */
            border: 1px solid #888;
            width: 50%; /* Could be more or less, depending on screen size */
        }

        /* Add padding to container elements */
        .container {
            padding: 16px;
            text-align: left;
            color: black;
        }

        input[type=text], input[type=email] {
            width: 100%;
            padding: 15px;
            margin: 5px 0 22px 0;
            display: inline-block;
            border: none;
            background: #f1f1f1;
        }

        /* Add a background color when the inputs get focus */
        input[type=text]:focus, input[type=email]:focus {
            background-color: #ddd;
            outline: none;
        }
        .one{
          color: #f5f1da;
          font-weight: bold;
        }

        h1{
          color: #000;
        }

        /* Set a style for all buttons */
        button {
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            width: 100%;
            opacity: 0.9;
        }

        button:hover {
            opacity:1;
        }

        .signupbtn {
            width: 100%;
        }


        /* Clear floats */
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        .two{
          width: 50%;
          margin: auto;
        }
    </style>
</head>
<body>
    <section id="title">
        <div class="container-fluid">

          <!-- Nav Bar -->

          <nav class="navbar  navbar-expand-lg navbar-dark">
            <a class="navbar-brand" href="index.html"><i class="fab fa-amazon-pay"></i> Microservices-Payments</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                  <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="about.html">About</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="contact.html">Contact us</a>
                </li>
              </ul>
            </div>
          </nav>
          <p class="one">GOT A QUESTION?</p>
          <h1><b>Contact US</b></h1>
          <p class="two">We’re here to help and answer any question you might have. We look forward to hearing from you 🙂</p>
          <form class="modal-content" action="mailto:kavyasri.narla@gmail.com" method="post" enctype="text/plain">
            <div class="container">
              <label><b>Name</b></label>
              <input type="text" placeholder="Enter your name" name="My name" value="" required>

              <label><b>Email</b></label>
              <input type="email" placeholder="Enter your Email" name="My email address" value="" required>

              <label><b>Your message !</b></label><br>
              <textarea placeholder="Write your message here" name="My message to you" rows="3" cols="54" required></textarea>

              <div class="clearfix">
                <button type="submit" class="signupbtn">Send</button>
              </div>
            </div>

          </form>
        </div>


    </section>
</body>
</html>
